          /** Infinite-scrolling poster grid over a paged loader. */
          @Composable
          fun PagedGrid(
              key: Any,
              loader: suspend (page: Int) -> Page,
              onOpen: (MediaItem) -> Unit,
              header: (@Composable () -> Unit)? = null,
              emptyTitle: String = "Nothing here",
          ) {
              val items = remember(key) { mutableStateListOf<MediaItem>() }
              var page by remember(key) { mutableIntStateOf(0) }
              var totalPages by remember(key) { mutableIntStateOf(1) }
              var loading by remember(key) { mutableStateOf(false) }
              var error by remember(key) { mutableStateOf<String?>(null) }
              var retry by remember(key) { mutableIntStateOf(0) }
              val state = rememberLazyGridState()

              suspend fun next() {
                  if (loading || page >= totalPages) return
                  loading = true
                  error = null
                  try {
                      val p = loader(page + 1)
                      val seen = items.map { "${it.mediaType}-${it.id}" }.toHashSet()
                      items.addAll(p.items.filter { seen.add("${it.mediaType}-${it.id}") })
                      page = p.page
                      totalPages = p.totalPages
                  } catch (e: Exception) {
                      error = e.message ?: "Something went wrong"
                  } finally {
                      loading = false
                  }
              }

              LaunchedEffect(key, retry) { if (items.isEmpty()) next() }

              val nearEnd by remember(key) {
                  derivedStateOf {
                      val last = state.layoutInfo.visibleItemsInfo.lastOrNull()?.index ?: 0
                      last >= state.layoutInfo.totalItemsCount - 6
                  }
              }
              LaunchedEffect(key) {
                  snapshotFlow { nearEnd }.distinctUntilChanged().filter { it }.collect { next() }
              }

              LazyVerticalGrid(
                  columns = GridCells.Adaptive(110.dp),
                  state = state,
                  contentPadding = PaddingValues(16.dp),
                  horizontalArrangement = Arrangement.spacedBy(12.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp),
                  modifier = Modifier.fillMaxSize(),
              ) {
                  if (header != null) item(span = { GridItemSpan(maxLineSpan) }) { header() }
                  items(items, key = { "${it.mediaType}-${it.id}" }) { item ->
                      PosterCard(item, onClick = { onOpen(item) }, width = null)
                  }
                  if (items.isEmpty() && loading) {
                      items(12) {
                          ShimmerBox(Modifier.fillMaxWidth().aspectRatio(2f / 3f).clip(RoundedCornerShape(12.dp)))
                      }
                  }
                  if (items.isEmpty() && !loading && error == null) {
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          MessageState(Icons.Filled.SearchOff, emptyTitle)
                      }
                  }
                  if (error != null) {
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          MessageState(Icons.Filled.CloudOff, "Couldn't load", error, "Retry", { retry++ })
                      }
                  }
                  if (items.isNotEmpty() && loading) {
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          Box(Modifier.fillMaxWidth().padding(16.dp), contentAlignment = Alignment.Center) {
                              CircularProgressIndicator(color = Indigo)
                          }
                      }
                  }
              }
          }

          @Composable
          fun CategoryScreen(category: Category, onBack: () -> Unit, onOpen: (MediaItem) -> Unit) {
              val api = LocalApi.current
              Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding()) {
                  Row(Modifier.fillMaxWidth().padding(4.dp), verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back") }
                      Text(category.title, style = MaterialTheme.typography.titleLarge)
                  }
                  PagedGrid(category, { api.discover(category, it) }, onOpen)
              }
          }

