          )

          // Survives tab switches
          private val discoverCache = mutableStateMapOf<Category, List<MediaItem>>()

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DiscoverScreen(
              onOpen: (MediaItem) -> Unit,
              onCategory: (Category) -> Unit,
              onSessionExpired: () -> Unit,
          ) {
              val api = LocalApi.current
              val scope = rememberCoroutineScope()
              var error by remember { mutableStateOf<String?>(null) }
              var refreshing by remember { mutableStateOf(false) }
              var reloadKey by rememberSaveable { mutableIntStateOf(0) }

              suspend fun load() {
                  error = null
                  try {
                      coroutineScope {
                          (listOf(Category.TRENDING) + rowCategories).map { cat ->
                              async { cat to api.discover(cat).items }
                          }.forEach {
                              val (cat, items) = it.await()
                              discoverCache[cat] = items
                          }
                      }
                  } catch (e: ApiException) {
                      if (e.code == 401 || e.code == 403) onSessionExpired() else error = e.message
                  } catch (e: Exception) {
                      error = e.message ?: "Couldn't reach server"
                  }
              }

              LaunchedEffect(reloadKey) {
                  if (discoverCache.isEmpty() || reloadKey > 0) load()
              }

              if (error != null && discoverCache.isEmpty()) {
                  Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      MessageState(Icons.Filled.CloudOff, "Can't reach Seerr", error, "Retry", { reloadKey++ })
                  }
                  return
              }

              PullToRefreshBox(
                  isRefreshing = refreshing,
                  onRefresh = {
                      scope.launch { refreshing = true; load(); refreshing = false }
                  },
                  modifier = Modifier.fillMaxSize(),
              ) {
                  LazyColumn(Modifier.fillMaxSize()) {
                      item {
                          Hero(discoverCache[Category.TRENDING]?.filter { it.backdropPath != null }?.take(8), onOpen)
                      }
                      item {
                          MediaRow("Trending Now", discoverCache[Category.TRENDING], onOpen) { onCategory(Category.TRENDING) }
                      }
                      rowCategories.forEach { cat ->
                          item(key = cat.name) {
                              MediaRow(cat.title, discoverCache[cat], onOpen) { onCategory(cat) }
                          }
                      }
                      item { Spacer(Modifier.height(24.dp)) }
                  }
              }
          }

