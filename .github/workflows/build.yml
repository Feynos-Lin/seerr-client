          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          fun DetailsScreen(type: String, id: Int, onBack: () -> Unit, onOpen: (MediaItem) -> Unit) {
              val api = LocalApi.current
              val snackbar = LocalSnackbar.current
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var details by remember { mutableStateOf(api.cachedDetails(type, id)) }
              var related by remember { mutableStateOf<List<MediaItem>?>(null) }
              var error by remember { mutableStateOf<String?>(null) }
              var reload by remember { mutableIntStateOf(0) }
              var requesting by remember { mutableStateOf(false) }
              var showSeasonSheet by remember { mutableStateOf(false) }

              LaunchedEffect(type, id, reload) {
                  error = null
                  try {
                      details = api.details(type, id, force = reload > 0)
                  } catch (e: Exception) {
                      if (details == null) error = e.message ?: "Couldn't load"
                  }
              }
              LaunchedEffect(type, id) { related = api.recommendations(type, id) }

              fun openUrl(url: String) {
                  runCatching { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url))) }
              }

              fun doRequest(seasons: List<Int>? = null) {
                  val d = details ?: return
                  requesting = true
                  scope.launch {
                      try {
                          if (d.isTv) api.requestTv(d.id, seasons ?: emptyList()) else api.requestMovie(d.id)
                          snackbar.showSnackbar("Requested ${d.title}")
                          reload++
                      } catch (e: Exception) {
                          snackbar.showSnackbar(e.message ?: "Request failed")
                      } finally {
                          requesting = false
                      }
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  val d = details
                  when {
                      error != null -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          MessageState(Icons.Filled.CloudOff, "Couldn't load title", error, "Retry", { reload++ })
                      }
                      d == null -> DetailsSkeleton()
                      else -> LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(bottom = 32.dp)) {
                          item { Backdrop(d) }
                          item {
                              Row(
                                  Modifier.padding(horizontal = 20.dp).offset(y = (-72).dp),
                                  verticalAlignment = Alignment.Bottom,
                              ) {
                                  Box(
                                      Modifier.width(120.dp).height(180.dp).clip(RoundedCornerShape(14.dp)).background(Surface2)
                                  ) {
                                      AsyncImage(
                                          tmdbImage(d.posterPath, "w342"), d.title,
                                          Modifier.fillMaxSize(), contentScale = ContentScale.Crop,
                                      )
                                  }
                                  Spacer(Modifier.width(16.dp))
                                  Column(Modifier.weight(1f).padding(bottom = 4.dp)) {
                                      TypePill(d.mediaType)
                                      Spacer(Modifier.height(6.dp))
                                      Text(d.title, style = MaterialTheme.typography.headlineMedium, maxLines = 3, overflow = TextOverflow.Ellipsis)
                                      Spacer(Modifier.height(6.dp))
                                      MetaLine(d)
                                  }
                              }
                          }
                          item {
                              Column(Modifier.padding(horizontal = 20.dp).offset(y = (-56).dp)) {
                                  Actions(
                                      d, requesting,
                                      onRequest = { if (d.isTv) showSeasonSheet = true else doRequest() },
                                      onPlay = { d.mediaUrl?.let { openUrl(it) } },
                                      onTrailer = { d.trailerUrl?.let { openUrl(it) } },
                                  )
                                  if (!d.tagline.isNullOrBlank()) {
                                      Spacer(Modifier.height(20.dp))
                                      Text("“${d.tagline}”", fontStyle = FontStyle.Italic, color = TextMuted)
                                  }
                                  Spacer(Modifier.height(12.dp))
                                  Text("Overview", style = MaterialTheme.typography.titleMedium)
                                  Spacer(Modifier.height(6.dp))
                                  Text(d.overview.ifBlank { "No overview available." }, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.85f))
                                  if (d.genres.isNotEmpty()) {
                                      Spacer(Modifier.height(14.dp))
                                      FlowRow(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                          d.genres.forEach { g ->
                                              Text(
                                                  g,
                                                  Modifier.clip(RoundedCornerShape(50)).background(Surface2).padding(horizontal = 12.dp, vertical = 6.dp),
                                                  style = MaterialTheme.typography.labelMedium,
                                              )
                                          }
                                      }
                                  }
                                  if (d.studio != null) {
                                      Spacer(Modifier.height(12.dp))
                                      Text(
                                          (if (d.isTv) "Network: " else "Studio: ") + d.studio,
                                          color = TextMuted, style = MaterialTheme.typography.bodySmall,
                                      )
                                  }
                              }
                          }
                          if (d.isTv && d.seasons.isNotEmpty()) {
                              item {
                                  Column(Modifier.offset(y = (-40).dp)) {
                                      SectionHeader("Seasons")
                                      Column(Modifier.padding(horizontal = 16.dp).clip(RoundedCornerShape(16.dp)).background(Surface1)) {
                                          d.seasons.forEachIndexed { i, s ->
                                              if (i > 0) HorizontalDivider(color = Surface2)
                                              Row(Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                                  Column(Modifier.weight(1f)) {
                                                      Text(s.name, style = MaterialTheme.typography.titleSmall)
                                                      Text(
                                                          listOfNotNull("${s.episodeCount} episodes", s.airYear.ifBlank { null }).joinToString(" • "),
                                                          color = TextMuted, style = MaterialTheme.typography.bodySmall,
                                                      )
                                                  }
                                                  seasonBadge(d, s.number)?.let { Badge(it) }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                          if (d.cast.isNotEmpty()) {
                              item {
                                  Column(Modifier.offset(y = (-32).dp)) {
                                      SectionHeader("Cast")
                                      LazyRow(contentPadding = PaddingValues(horizontal = 16.dp), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                                          items(d.cast, key = { it.id.toString() + it.character }) { c ->
                                              Column(Modifier.width(84.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                                  Box(Modifier.size(76.dp).clip(CircleShape).background(Surface2), contentAlignment = Alignment.Center) {
                                                      Text(c.name.take(1), style = MaterialTheme.typography.titleLarge, color = TextMuted)
                                                      AsyncImage(tmdbImage(c.profilePath, "w185"), c.name, Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                                                  }
                                                  Spacer(Modifier.height(6.dp))
                                                  Text(c.name, style = MaterialTheme.typography.labelMedium, maxLines = 2, textAlign = TextAlign.Center, overflow = TextOverflow.Ellipsis)
                                                  Text(c.character, style = MaterialTheme.typography.bodySmall, color = TextMuted, maxLines = 1, textAlign = TextAlign.Center, overflow = TextOverflow.Ellipsis)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                          item {
                              Column(Modifier.offset(y = (-24).dp).navigationBarsPadding()) {
                                  MediaRow("More Like This", related, onOpen)
                              }
                          }
                      }
                  }

                  IconButton(
                      onClick = onBack,
                      colors = IconButtonDefaults.iconButtonColors(containerColor = Color.Black.copy(alpha = 0.45f), contentColor = Color.White),
                      modifier = Modifier.statusBarsPadding().padding(8.dp),
                  ) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back") }

                  val sd = details
                  if (showSeasonSheet && sd != null) {
                      SeasonSheet(sd, onDismiss = { showSeasonSheet = false }) { seasons ->
                          showSeasonSheet = false
                          doRequest(seasons)
                      }
                  }
              }
          }

          private fun seasonBadge(d: Details, n: Int) = when {
              d.seasonStatus[n] == MediaStatus.AVAILABLE || d.status == MediaStatus.AVAILABLE -> mediaStatusStyle(MediaStatus.AVAILABLE)
              d.seasonStatus[n] == MediaStatus.PARTIAL -> mediaStatusStyle(MediaStatus.PARTIAL)
              d.seasonStatus[n] == MediaStatus.PROCESSING -> mediaStatusStyle(MediaStatus.PROCESSING)
              n in d.requestedSeasons || d.seasonStatus[n] == MediaStatus.PENDING -> mediaStatusStyle(MediaStatus.PENDING)
              else -> null
          }

          private fun seasonLocked(d: Details, n: Int) = seasonBadge(d, n) != null &&
              d.seasonStatus[n] != MediaStatus.PARTIAL

          @Composable
          private fun Backdrop(d: Details) {
              Box(Modifier.fillMaxWidth().height(320.dp)) {
                  AsyncImage(
                      tmdbImage(d.backdropPath ?: d.posterPath, "w1280"), null,
                      Modifier.fillMaxSize(), contentScale = ContentScale.Crop,
                  )
                  Box(
                      Modifier.fillMaxSize().background(
                          Brush.verticalGradient(0f to Night.copy(alpha = 0.5f), 0.3f to Color.Transparent, 1f to Night)
                      )
                  )
              }
          }

          @Composable
          private fun MetaLine(d: Details) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  if (d.rating > 0) {
                      Icon(Icons.Filled.Star, null, tint = Yellow, modifier = Modifier.size(15.dp))
                      Spacer(Modifier.width(3.dp))
                      Text("%.1f".format(d.rating), style = MaterialTheme.typography.labelLarge)
                  }
                  val parts = listOfNotNull(
                      d.year.ifBlank { null },
                      if (d.isTv) d.seasons.size.takeIf { it > 0 }?.let { "$it season" + if (it > 1) "s" else "" } else formatRuntime(d.runtime),
                  )
                  if (parts.isNotEmpty()) {
                      Text(
                          (if (d.rating > 0) "  •  " else "") + parts.joinToString("  •  "),
                          color = TextMuted, style = MaterialTheme.typography.labelLarge,
                      )
                  }
              }
          }

          @Composable
          private fun Actions(
              d: Details,
              requesting: Boolean,
              onRequest: () -> Unit,
              onPlay: () -> Unit,
              onTrailer: () -> Unit,
          ) {
              val fullyAvailable = d.status == MediaStatus.AVAILABLE
              val allSeasonsCovered = d.isTv && d.seasons.isNotEmpty() && d.seasons.all { seasonLocked(d, it.number) }
              val blocked = fullyAvailable || (!d.isTv && (d.hasActiveRequest || d.status == MediaStatus.PROCESSING || d.status == MediaStatus.PENDING)) || allSeasonsCovered

              Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  mediaStatusStyle(d.status)?.let { Badge(it) }
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      if (d.mediaUrl != null && (d.status == MediaStatus.AVAILABLE || d.status == MediaStatus.PARTIAL)) {
                          Button(
                              onClick = onPlay,
                              colors = ButtonDefaults.buttonColors(containerColor = Green),
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.weight(1f).height(48.dp),
                          ) {
                              Icon(Icons.Filled.PlayArrow, null)
                              Spacer(Modifier.width(6.dp))
                              Text("Play", fontWeight = FontWeight.Bold)
                          }
                      }
                      if (!blocked) {
                          Button(
                              onClick = onRequest,
                              enabled = !requesting,
                              colors = ButtonDefaults.buttonColors(containerColor = Indigo),
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.weight(1f).height(48.dp),
                          ) {
                              if (requesting) CircularProgressIndicator(Modifier.size(18.dp), color = Color.White, strokeWidth = 2.dp)
                              else Icon(Icons.Filled.Add, null)
                              Spacer(Modifier.width(6.dp))
                              Text(if (d.isTv && d.status == MediaStatus.PARTIAL) "Request More" else "Request", fontWeight = FontWeight.Bold)
                          }
                      } else if (d.mediaUrl == null || !(d.status == MediaStatus.AVAILABLE || d.status == MediaStatus.PARTIAL)) {
                          Row(
                              Modifier.weight(1f).height(48.dp).clip(RoundedCornerShape(12.dp)).background(Surface2).padding(horizontal = 14.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.Center,
                          ) {
                              val avail = fullyAvailable
                              Icon(if (avail) Icons.Filled.CheckCircle else Icons.Filled.Schedule, null, tint = if (avail) Green else Yellow, modifier = Modifier.size(18.dp))
                              Spacer(Modifier.width(8.dp))
                              Text(if (avail) "In your library" else "Requested", style = MaterialTheme.typography.labelLarge)
                          }
                      }
                      if (d.trailerUrl != null) {
                          OutlinedButton(
                              onClick = onTrailer,
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.height(48.dp),
                          ) {
                              Icon(Icons.Filled.Theaters, null, Modifier.size(18.dp))
                              Spacer(Modifier.width(6.dp))
                              Text("Trailer")
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun SeasonSheet(d: Details, onDismiss: () -> Unit, onConfirm: (List<Int>) -> Unit) {
              val state = rememberModalBottomSheetState(skipPartiallyExpanded = true)
              val requestable = d.seasons.filter { !seasonLocked(d, it.number) }.map { it.number }
