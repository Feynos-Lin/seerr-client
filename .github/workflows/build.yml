                                  Text("  Trending this week", style = MaterialTheme.typography.titleMedium)
                              }
                          },
                      )
                  } else {
                      PagedGrid(
                          key = "q:$debounced",
                          loader = { api.search(debounced, it) },
                          onOpen = onOpen,
                          emptyTitle = "No results for \"$debounced\"",
                      )
                  }
              }
