              var error by remember { mutableStateOf<String?>(null) }

              fun normalize(url: String): String {
                  var u = url.trim().trimEnd('/')
                  if (u.isNotEmpty() && !u.startsWith("http://") && !u.startsWith("https://")) u = "https://$u"
                  return u
              }

