      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore fallback signing key
        id: kscache
        uses: actions/cache@v4
        with:
          path: ~/.feynos-keystore
          key: feynos-seerr-keystore-v1

      - name: Prepare signing key
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
          else
            mkdir -p ~/.feynos-keystore
            if [ ! -f ~/.feynos-keystore/release.jks ]; then
              keytool -genkeypair -v -keystore ~/.feynos-keystore/release.jks -storetype JKS \
                -alias feynos -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass feynosseerr -keypass feynosseerr \
                -dname "CN=Feynos Seerr, O=Feynos, C=US"
            fi
            {
              echo "KEYSTORE_PATH=$HOME/.feynos-keystore/release.jks"
              echo "KEYSTORE_PASSWORD=feynosseerr"
              echo "KEY_ALIAS=feynos"
              echo "KEY_PASSWORD=feynosseerr"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|Could not|error:" -A2 project/build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: |
          mkdir -p dist
          cp project/app/build/outputs/apk/release/app-release.apk "dist/FeynosSeerr-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FeynosSeerr-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Feynos Seerr ${{ env.VERSION_NAME }}
          make_latest: true
          files: dist/*.apk
          body: |
            Android client for Seerr (Overseerr / Jellyseerr).
            Built from ${{ github.sha }}.
