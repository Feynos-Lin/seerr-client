          import com.feynos.seerr.ui.theme.SeerrTheme

          val LocalApi = staticCompositionLocalOf<SeerrApi> { error("no api") }
          val LocalSnackbar = staticCompositionLocalOf<SnackbarHostState> { error("no snackbar") }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  val api = SeerrApi(Prefs(applicationContext))
                  Coil.setImageLoader(
                      ImageLoader.Builder(applicationContext)
                          .okHttpClient(api.client)
                          .crossfade(true)
                          .build()
                  )
                  setContent {
                      SeerrTheme {
                          val snackbar = remember { SnackbarHostState() }
                          CompositionLocalProvider(LocalApi provides api, LocalSnackbar provides snackbar) {
                              SeerrApp(api, snackbar)
                          }
                      }
                  }
              }
          }

          private data class Tab(val route: String, val label: String, val icon: ImageVector, val selectedIcon: ImageVector)

          private val tabs = listOf(
              Tab("discover", "Discover", Icons.Outlined.Explore, Icons.Filled.Explore),
              Tab("search", "Search", Icons.Outlined.Search, Icons.Filled.Search),
              Tab("requests", "Requests", Icons.Outlined.Inbox, Icons.Filled.Inbox),
              Tab("profile", "Profile", Icons.Outlined.AccountCircle, Icons.Filled.AccountCircle),
          )

          fun NavHostController.openMedia(type: String, id: Int) = navigate("details/$type/$id")

          @Composable
          fun SeerrApp(api: SeerrApi, snackbar: SnackbarHostState) {
              val nav = rememberNavController()
              val backStack by nav.currentBackStackEntryAsState()
              val route = backStack?.destination?.route
              val showBar = tabs.any { it.route == route }

              Scaffold(
                  containerColor = Night,
                  contentWindowInsets = WindowInsets(0),
                  snackbarHost = { SnackbarHost(snackbar) },
                  bottomBar = {
                      if (showBar) {
                          NavigationBar(containerColor = Surface1) {
                              tabs.forEach { tab ->
                                  val selected = route == tab.route
                                  NavigationBarItem(
                                      selected = selected,
                                      onClick = {
                                          nav.navigate(tab.route) {
                                              popUpTo(nav.graph.findStartDestination().id) { saveState = true }
                                              launchSingleTop = true
                                              restoreState = true
                                          }
                                      },
                                      icon = { Icon(if (selected) tab.selectedIcon else tab.icon, tab.label) },
                                      label = { Text(tab.label) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = Indigo,
                                          selectedTextColor = Indigo,
                                          indicatorColor = Indigo.copy(alpha = 0.15f),
                                          unselectedIconColor = TextMuted,
                                          unselectedTextColor = TextMuted,
                                      ),
                                  )
                              }
                          }
                      }
                  },
              ) { padding ->
                  Box(Modifier.fillMaxSize().padding(padding)) {
                      NavHost(
                          navController = nav,
                          startDestination = if (api.prefs.isLoggedIn) "discover" else "login",
                          enterTransition = { fadeIn() },
                          exitTransition = { fadeOut() },
                      ) {
                          composable("login") {
                              LoginScreen(onLoggedIn = {
                                  nav.navigate("discover") { popUpTo("login") { inclusive = true } }
                              })
                          }
                          composable("discover") {
                              DiscoverScreen(
                                  onOpen = { nav.openMedia(it.mediaType, it.id) },
                                  onCategory = { nav.navigate("category/${it.name}") },
                                  onSessionExpired = { nav.toLogin() },
                              )
                          }
                          composable("search") { SearchScreen(onOpen = { nav.openMedia(it.mediaType, it.id) }) }
                          composable("requests") { RequestsScreen(onOpen = { t, id -> nav.openMedia(t, id) }) }
                          composable("profile") { ProfileScreen(onLoggedOut = { nav.toLogin() }) }
                          composable(
                              "details/{type}/{id}",
                              arguments = listOf(
                                  navArgument("type") { type = NavType.StringType },
                                  navArgument("id") { type = NavType.IntType },
                              ),
                              enterTransition = { slideInHorizontally { it / 3 } + fadeIn() },
                              popExitTransition = { slideOutHorizontally { it / 3 } + fadeOut() },
                          ) { entry ->
                              DetailsScreen(
                                  type = entry.arguments?.getString("type") ?: "movie",
                                  id = entry.arguments?.getInt("id") ?: 0,
                                  onBack = { nav.popBackStack() },
                                  onOpen = { nav.openMedia(it.mediaType, it.id) },
                              )
                          }
                          composable("category/{key}") { entry ->
                              val cat = runCatching { Category.valueOf(entry.arguments?.getString("key") ?: "") }
                                  .getOrDefault(Category.TRENDING)
                              CategoryScreen(cat, onBack = { nav.popBackStack() }, onOpen = { nav.openMedia(it.mediaType, it.id) })
                          }
                      }
                  }
              }
          }

          private fun NavHostController.toLogin() {
              navigate("login") { popUpTo(0) { inclusive = true } }
          }

          object BuildConfigInfo {
              fun versionName(context: android.content.Context): String = runCatching {
                  context.packageManager.getPackageInfo(context.packageName, 0).versionName ?: "?"
              }.getOrDefault("?")
          }
          FEYNOS_EOF
          mkdir -p 'app/src/main/java/com/feynos/seerr/data'
          cat > 'app/src/main/java/com/feynos/seerr/data/Models.kt' <<'FEYNOS_EOF'
          package com.feynos.seerr.data

          import org.json.JSONArray
          import org.json.JSONObject

          // Media status (mediaInfo.status)
          object MediaStatus {
              const val UNKNOWN = 1
              const val PENDING = 2
              const val PROCESSING = 3
              const val PARTIAL = 4
              const val AVAILABLE = 5
              const val DELETED = 6
          }

          // Request status
          object RequestStatus {
              const val PENDING = 1
              const val APPROVED = 2
              const val DECLINED = 3
              const val FAILED = 4
              const val COMPLETED = 5
          }

          object Permission {
              const val ADMIN = 2
              const val MANAGE_REQUESTS = 16
              const val REQUEST_4K = 1024
          }

          fun JSONObject.str(key: String): String? =
              if (has(key) && !isNull(key)) optString(key).takeIf { it.isNotEmpty() } else null

          fun JSONObject.obj(key: String): JSONObject? =
              if (has(key) && !isNull(key)) optJSONObject(key) else null

          fun JSONObject.arr(key: String): JSONArray =
              if (has(key) && !isNull(key)) optJSONArray(key) ?: JSONArray() else JSONArray()

          fun JSONObject.intOrNull(key: String): Int? =
              if (has(key) && !isNull(key)) optInt(key) else null

          inline fun JSONArray.forEachObject(block: (JSONObject) -> Unit) {
              for (i in 0 until length()) optJSONObject(i)?.let(block)
          }

          inline fun <T> JSONArray.mapObjects(block: (JSONObject) -> T?): List<T> {
              val out = ArrayList<T>(length())
              for (i in 0 until length()) {
                  val o = optJSONObject(i) ?: continue
                  block(o)?.let { out.add(it) }
              }
              return out
          }

          fun tmdbImage(path: String?, size: String = "w500"): String? =
              path?.let { "https://image.tmdb.org/t/p/$size$it" }

          data class MediaItem(
              val id: Int,
              val mediaType: String,
              val title: String,
              val posterPath: String?,
              val backdropPath: String?,
              val overview: String,
              val year: String,
              val rating: Double,
              val status: Int,
          ) {
              companion object {
                  fun parse(o: JSONObject, fallbackType: String? = null): MediaItem? {
                      val type = o.str("mediaType") ?: fallbackType ?: return null
                      if (type != "movie" && type != "tv") return null
                      val date = o.str("releaseDate") ?: o.str("firstAirDate") ?: ""
                      return MediaItem(
                          id = o.optInt("id"),
                          mediaType = type,
                          title = o.str("title") ?: o.str("name") ?: "Untitled",
                          posterPath = o.str("posterPath"),
                          backdropPath = o.str("backdropPath"),
                          overview = o.str("overview") ?: "",
                          year = date.take(4),
                          rating = o.optDouble("voteAverage", 0.0).let { if (it.isNaN()) 0.0 else it },
                          status = o.obj("mediaInfo")?.optInt("status", 0) ?: 0,
                      )
                  }
              }
          }

          data class Page(val items: List<MediaItem>, val page: Int, val totalPages: Int)

          data class CastMember(val id: Int, val name: String, val character: String, val profilePath: String?)

          data class Season(
              val number: Int,
              val name: String,
              val episodeCount: Int,
              val posterPath: String?,
              val airYear: String,
          )

          data class Details(
              val id: Int,
              val mediaType: String,
              val title: String,
              val tagline: String?,
              val overview: String,
              val posterPath: String?,
              val backdropPath: String?,
              val year: String,
              val runtime: Int?,
              val rating: Double,
              val genres: List<String>,
              val cast: List<CastMember>,
              val seasons: List<Season>,
              val status: Int,
              val status4k: Int,
              val trailerUrl: String?,
              val mediaUrl: String?,
              val studio: String?,
              val seasonStatus: Map<Int, Int>,
              val requestedSeasons: Set<Int>,
              val hasActiveRequest: Boolean,
          ) {
              val isTv get() = mediaType == "tv"

              companion object {
                  fun parse(o: JSONObject, type: String): Details {
                      val info = o.obj("mediaInfo")
                      val seasonStatus = HashMap<Int, Int>()
                      val requested = HashSet<Int>()
                      var activeRequest = false
                      if (info != null) {
                          info.arr("seasons").forEachObject { s ->
                              seasonStatus[s.optInt("seasonNumber")] = s.optInt("status")
                          }
                          info.arr("requests").forEachObject { r ->
                              val st = r.optInt("status")
                              if (st == RequestStatus.PENDING || st == RequestStatus.APPROVED) {
                                  if (!r.optBoolean("is4k")) activeRequest = true
                                  r.arr("seasons").forEachObject { s -> requested.add(s.optInt("seasonNumber")) }
                              }
                          }
                      }
                      val trailer = o.arr("relatedVideos").mapObjects { v ->
                              if (v.str("type") == "Trailer" && v.str("site") == "YouTube") v.str("url")
                                  ?: v.str("key")?.let { "https://www.youtube.com/watch?v=$it" } else null
                          }.firstOrNull()
                      val runtime = o.intOrNull("runtime")
                          ?: o.arr("episodeRunTime").let { if (it.length() > 0) it.optInt(0) else null }
                      val date = o.str("releaseDate") ?: o.str("firstAirDate") ?: ""
                      val studio = if (type == "tv") o.arr("networks").mapObjects { it.str("name") }.firstOrNull()
                      else o.arr("productionCompanies").mapObjects { it.str("name") }.firstOrNull()

                      return Details(
                          id = o.optInt("id"),
                          mediaType = type,
                          title = o.str("title") ?: o.str("name") ?: "Untitled",
                          tagline = o.str("tagline"),
                          overview = o.str("overview") ?: "",
                          posterPath = o.str("posterPath"),
                          backdropPath = o.str("backdropPath"),
                          year = date.take(4),
                          runtime = runtime?.takeIf { it > 0 },
                          rating = o.optDouble("voteAverage", 0.0).let { if (it.isNaN()) 0.0 else it },
                          genres = o.arr("genres").mapObjects { it.str("name") },
                          cast = (o.obj("credits")?.arr("cast") ?: JSONArray()).mapObjects {
                              CastMember(it.optInt("id"), it.str("name") ?: "", it.str("character") ?: "", it.str("profilePath"))
                          }.take(20),
                          seasons = o.arr("seasons").mapObjects {
                              val n = it.optInt("seasonNumber")
                              if (n <= 0) null else Season(
                                  n,
                                  it.str("name") ?: "Season $n",
                                  it.optInt("episodeCount"),
                                  it.str("posterPath"),
                                  (it.str("airDate") ?: "").take(4),
                              )
                          },
                          status = info?.optInt("status", 0) ?: 0,
                          status4k = info?.optInt("status4k", 0) ?: 0,
                          trailerUrl = trailer,
                          mediaUrl = info?.str("mediaUrl") ?: info?.str("plexUrl") ?: info?.str("jellyfinMediaUrl"),
                          studio = studio,
                          seasonStatus = seasonStatus,
                          requestedSeasons = requested,
                          hasActiveRequest = activeRequest,
                      )
                  }
              }
          }

          data class User(
              val id: Int,
              val displayName: String,
              val email: String,
              val avatar: String?,
              val permissions: Int,
              val userType: Int,
              val createdAt: String?,
          ) {
              val isAdmin get() = permissions and Permission.ADMIN != 0
              val canManage get() = isAdmin || (permissions and Permission.MANAGE_REQUESTS != 0)
              val role get() = when {
                  isAdmin -> "Admin"
                  canManage -> "Manager"
                  else -> "User"
              }
              val accountType get() = when (userType) {
                  1 -> "Plex"
                  2 -> "Local"
                  3, 4 -> "Jellyfin / Emby"
                  else -> "Seerr"
              }

              companion object {
                  fun parse(o: JSONObject) = User(
                      id = o.optInt("id"),
                      displayName = o.str("displayName") ?: o.str("username") ?: o.str("plexUsername")
                          ?: o.str("jellyfinUsername") ?: o.str("email") ?: "User",
                      email = o.str("email") ?: "",
                      avatar = o.str("avatar"),
                      permissions = o.optInt("permissions"),
                      userType = o.optInt("userType"),
                      createdAt = o.str("createdAt"),
                  )
              }
          }

          data class RequestItem(
              val id: Int,
              val status: Int,
              val type: String,
              val is4k: Boolean,
              val createdAt: String?,
              val tmdbId: Int,
              val mediaStatus: Int,
              val requestedBy: String,
              val requestedByAvatar: String?,
              val requestedById: Int,
              val seasons: List<Int>,
          ) {
              companion object {
                  fun parse(o: JSONObject): RequestItem? {
                      val media = o.obj("media") ?: return null
                      val by = o.obj("requestedBy")
                      return RequestItem(
                          id = o.optInt("id"),
                          status = o.optInt("status"),
                          type = o.str("type") ?: media.str("mediaType") ?: "movie",
                          is4k = o.optBoolean("is4k"),
                          createdAt = o.str("createdAt"),
                          tmdbId = media.optInt("tmdbId"),
                          mediaStatus = if (o.optBoolean("is4k")) media.optInt("status4k") else media.optInt("status"),
                          requestedBy = by?.let { User.parse(it).displayName } ?: "Unknown",
                          requestedByAvatar = by?.str("avatar"),
                          requestedById = by?.optInt("id") ?: 0,
                          seasons = o.arr("seasons").mapObjects { it.optInt("seasonNumber") },
                      )
                  }
              }
          }

          data class RequestCounts(
              val total: Int,
              val pending: Int,
              val approved: Int,
              val processing: Int,
              val available: Int,
              val declined: Int,
          )

          data class ServerStatus(val version: String, val updateAvailable: Boolean)
          FEYNOS_EOF
          mkdir -p 'app/src/main/java/com/feynos/seerr/data'
          cat > 'app/src/main/java/com/feynos/seerr/data/Prefs.kt' <<'FEYNOS_EOF'
          package com.feynos.seerr.data

          import android.content.Context
          import java.util.UUID

          class Prefs(context: Context) {
              private val sp = context.getSharedPreferences("seerr", Context.MODE_PRIVATE)

              var server: String
                  get() = sp.getString("server", "") ?: ""
                  set(v) = sp.edit().putString("server", v).apply()

              var cookie: String?
                  get() = sp.getString("cookie", null)
                  set(v) = sp.edit().putString("cookie", v).apply()

              var apiKey: String?
                  get() = sp.getString("apiKey", null)
                  set(v) = sp.edit().putString("apiKey", v).apply()

              var lastMethod: String
                  get() = sp.getString("method", "local") ?: "local"
                  set(v) = sp.edit().putString("method", v).apply()

              val clientId: String
                  get() {
                      val existing = sp.getString("clientId", null)
                      if (existing != null) return existing
                      val id = UUID.randomUUID().toString()
                      sp.edit().putString("clientId", id).apply()
                      return id
                  }

              val isLoggedIn: Boolean
                  get() = server.isNotBlank() && (cookie != null || apiKey != null)

              fun clearSession() {
                  sp.edit().remove("cookie").remove("apiKey").apply()
              }
          }
          FEYNOS_EOF
          mkdir -p 'app/src/main/java/com/feynos/seerr/data'
          cat > 'app/src/main/java/com/feynos/seerr/data/SeerrApi.kt' <<'FEYNOS_EOF'
          package com.feynos.seerr.data

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.HttpUrl.Companion.toHttpUrlOrNull
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.TimeUnit

          class ApiException(val code: Int, message: String) : Exception(message)

          class SeerrApi(val prefs: Prefs) {

              private val json = "application/json; charset=utf-8".toMediaType()

              val client: OkHttpClient = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .addInterceptor { chain ->
                      val req = chain.request()
                      val serverHost = prefs.server.toHttpUrlOrNull()?.host
                      val b = req.newBuilder()
                      if (serverHost != null && req.url.host == serverHost) {
                          prefs.apiKey?.let { b.header("X-Api-Key", it) }
                          prefs.cookie?.let { b.header("Cookie", it) }
                      }
                      val resp = chain.proceed(b.build())
                      if (serverHost != null && req.url.host == serverHost) {
                          resp.headers("Set-Cookie").firstOrNull { it.startsWith("connect.sid=") }?.let {
                              prefs.cookie = it.substringBefore(";")
                          }
                      }
                      resp
                  }
                  .build()

              val base: String get() = prefs.server.trimEnd('/')

              fun absoluteUrl(path: String?): String? = when {
                  path.isNullOrBlank() -> null
                  path.startsWith("http") -> path
                  path.startsWith("/") -> base + path
                  else -> "$base/$path"
              }

              private fun exec(req: Request): String {
                  client.newCall(req).execute().use { r ->
                      val body = r.body?.string() ?: ""
                      if (!r.isSuccessful) {
                          val msg = runCatching { JSONObject(body).optString("message") }.getOrNull()
                              ?.takeIf { it.isNotBlank() }
                              ?: when (r.code) {
                                  401 -> "Not signed in or invalid credentials"
                                  403 -> "You don't have permission to do that"
                                  404 -> "Not found"
                                  else -> "Server error (${r.code})"
                              }
                          throw ApiException(r.code, msg)
                      }
                      return body
                  }
              }

              private fun url(path: String) = "$base/api/v1$path"

              suspend fun get(path: String): String = withContext(Dispatchers.IO) {
                  exec(Request.Builder().url(url(path)).header("Accept", "application/json").get().build())
              }

              suspend fun post(path: String, body: JSONObject? = null): String = withContext(Dispatchers.IO) {
                  exec(
                      Request.Builder().url(url(path)).header("Accept", "application/json")
                          .post((body?.toString() ?: "{}").toRequestBody(json)).build()
                  )
              }

              suspend fun delete(path: String): String = withContext(Dispatchers.IO) {
                  exec(Request.Builder().url(url(path)).delete().build())
              }

              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8").replace("+", "%20")

              // ---- Auth ----

              suspend fun status(): ServerStatus {
                  val o = JSONObject(get("/status"))
                  return ServerStatus(o.optString("version", "?"), o.optBoolean("updateAvailable"))
              }

              suspend fun loginLocal(email: String, password: String): User {
                  prefs.apiKey = null; prefs.cookie = null
                  post("/auth/local", JSONObject().put("email", email).put("password", password))
                  return me()
              }

              suspend fun loginJellyfin(username: String, password: String): User {
                  prefs.apiKey = null; prefs.cookie = null
                  post("/auth/jellyfin", JSONObject().put("username", username).put("password", password))
                  return me()
              }

              suspend fun loginPlex(authToken: String): User {
                  prefs.apiKey = null; prefs.cookie = null
                  post("/auth/plex", JSONObject().put("authToken", authToken))
                  return me()
              }

              suspend fun loginApiKey(key: String): User {
                  prefs.cookie = null
                  prefs.apiKey = key
                  return try { me() } catch (e: Exception) { prefs.apiKey = null; throw e }
              }

              suspend fun me(): User = User.parse(JSONObject(get("/auth/me")))

              suspend fun logout() {
                  runCatching { post("/auth/logout") }
                  prefs.clearSession()
                  cache.clear()
              }

              // ---- Plex PIN OAuth ----

              data class PlexPin(val id: Long, val code: String)

              private fun plexReq(url: String) = Request.Builder().url(url)
                  .header("Accept", "application/json")
                  .header("X-Plex-Product", "Feynos Seerr")
                  .header("X-Plex-Client-Identifier", prefs.clientId)
                  .header("X-Plex-Device", "Android")
                  .header("X-Plex-Platform", "Android")

              suspend fun createPlexPin(): PlexPin = withContext(Dispatchers.IO) {
                  val o = JSONObject(exec(plexReq("https://plex.tv/api/v2/pins?strong=true").post("".toRequestBody(null)).build()))
                  PlexPin(o.getLong("id"), o.getString("code"))
              }

              fun plexAuthUrl(pin: PlexPin): String =
                  "https://app.plex.tv/auth#?clientID=${enc(prefs.clientId)}&code=${enc(pin.code)}" +
                      "&context%5Bdevice%5D%5Bproduct%5D=${enc("Feynos Seerr")}"

              suspend fun checkPlexPin(pin: PlexPin): String? = withContext(Dispatchers.IO) {
                  val o = JSONObject(exec(plexReq("https://plex.tv/api/v2/pins/${pin.id}").get().build()))
                  o.str("authToken")
              }

              // ---- Discover / search ----

              private fun parsePage(s: String, fallbackType: String? = null): Page {
                  val o = JSONObject(s)
                  return Page(
                      o.arr("results").mapObjects { MediaItem.parse(it, fallbackType) },
                      o.optInt("page", 1),
                      o.optInt("totalPages", 1),
                  )
              }

              suspend fun discover(category: Category, page: Int = 1): Page =
                  parsePage(get("${category.path}?page=$page&language=en"), category.fallbackType)

              suspend fun search(query: String, page: Int = 1): Page =
                  parsePage(get("/search?query=${enc(query)}&page=$page&language=en"))

              private val cache = ConcurrentHashMap<String, Details>()

              fun cachedDetails(type: String, id: Int): Details? = cache["$type/$id"]

              suspend fun details(type: String, id: Int, force: Boolean = false): Details {
                  val key = "$type/$id"
                  if (!force) cache[key]?.let { return it }
                  val d = Details.parse(JSONObject(get("/$type/$id?language=en")), type)
                  cache[key] = d
                  return d
              }

              suspend fun recommendations(type: String, id: Int): List<MediaItem> =
                  runCatching { parsePage(get("/$type/$id/recommendations?page=1&language=en"), type).items }
                      .getOrDefault(emptyList())
                      .ifEmpty {
                          runCatching { parsePage(get("/$type/$id/similar?page=1&language=en"), type).items }
                              .getOrDefault(emptyList())
                      }

              // ---- Requests ----

              suspend fun requestMovie(tmdbId: Int, is4k: Boolean = false) {
                  post("/request", JSONObject().put("mediaType", "movie").put("mediaId", tmdbId).put("is4k", is4k))
                  cache.remove("movie/$tmdbId")
              }

              suspend fun requestTv(tmdbId: Int, seasons: List<Int>, is4k: Boolean = false) {
                  post(
                      "/request",
                      JSONObject().put("mediaType", "tv").put("mediaId", tmdbId).put("is4k", is4k)
                          .put("seasons", JSONArray(seasons))
                  )
                  cache.remove("tv/$tmdbId")
              }

              data class RequestPage(val items: List<RequestItem>, val total: Int)

              suspend fun requests(filter: String, skip: Int, take: Int = 20, userId: Int? = null): RequestPage {
                  val path = if (userId != null) "/user/$userId/requests?take=$take&skip=$skip"
                  else "/request?take=$take&skip=$skip&filter=$filter&sort=added"
                  val o = JSONObject(get(path))
                  return RequestPage(
                      o.arr("results").mapObjects { RequestItem.parse(it) },
                      o.obj("pageInfo")?.optInt("results") ?: 0,
                  )
              }

              suspend fun approve(id: Int) { post("/request/$id/approve") }
              suspend fun decline(id: Int) { post("/request/$id/decline") }
              suspend fun deleteRequest(id: Int) { delete("/request/$id") }

              suspend fun requestCounts(): RequestCounts {
                  val o = JSONObject(get("/request/count"))
                  return RequestCounts(
                      o.optInt("total"), o.optInt("pending"), o.optInt("approved"),
                      o.optInt("processing"), o.optInt("available"), o.optInt("declined"),
                  )
              }

              suspend fun userRequestTotal(userId: Int): Int =
                  JSONObject(get("/user/$userId/requests?take=1&skip=0")).obj("pageInfo")?.optInt("results") ?: 0
          }

          enum class Category(val title: String, val path: String, val fallbackType: String?) {
              TRENDING("Trending", "/discover/trending", null),
              POPULAR_MOVIES("Popular Movies", "/discover/movies", "movie"),
              POPULAR_TV("Popular Series", "/discover/tv", "tv"),
              UPCOMING_MOVIES("Upcoming Movies", "/discover/movies/upcoming", "movie"),
              UPCOMING_TV("Upcoming Series", "/discover/tv/upcoming", "tv"),
          }
