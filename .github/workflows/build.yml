          data class BadgeStyle(val label: String, val color: Color, val icon: ImageVector)

          fun mediaStatusStyle(status: Int): BadgeStyle? = when (status) {
              MediaStatus.AVAILABLE -> BadgeStyle("Available", Green, Icons.Filled.CheckCircle)
              MediaStatus.PARTIAL -> BadgeStyle("Partially Available", Green, Icons.Filled.CheckCircle)
              MediaStatus.PROCESSING -> BadgeStyle("Processing", Blue, Icons.Filled.Sync)
              MediaStatus.PENDING -> BadgeStyle("Pending", Yellow, Icons.Filled.Schedule)
              else -> null
          }

          fun requestStatusStyle(status: Int, mediaStatus: Int): BadgeStyle = when (status) {
              RequestStatus.PENDING -> BadgeStyle("Pending", Yellow, Icons.Filled.Schedule)
              RequestStatus.DECLINED -> BadgeStyle("Declined", Red, Icons.Filled.CloudOff)
              RequestStatus.FAILED -> BadgeStyle("Failed", Red, Icons.Filled.CloudOff)
              else -> when (mediaStatus) {
                  MediaStatus.AVAILABLE -> BadgeStyle("Available", Green, Icons.Filled.CheckCircle)
                  MediaStatus.PARTIAL -> BadgeStyle("Partially Available", Green, Icons.Filled.CheckCircle)
                  MediaStatus.PROCESSING -> BadgeStyle("Processing", Blue, Icons.Filled.Sync)
                  else -> BadgeStyle(if (status == RequestStatus.COMPLETED) "Completed" else "Approved", Indigo, Icons.Filled.CheckCircle)
              }
          }

