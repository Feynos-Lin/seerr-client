# Feynos Seerr — Android client for Seerr (Overseerr / Jellyseerr).
# The entire app source lives inside this workflow: it writes the project,
# builds a signed release APK, and publishes it as a GitHub release.
name: Build Feynos Seerr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Generate project
        run: |
          mkdir -p project && cd project
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'FEYNOS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val vCode = (System.getenv("VERSION_CODE") ?: "1").toInt()
          val vName = System.getenv("VERSION_NAME") ?: "1.0.0"
          val ksPath = System.getenv("KEYSTORE_PATH")

          android {
              namespace = "com.feynos.seerr"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.feynos.seerr"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = vCode
                  versionName = vName
              }

              signingConfigs {
                  create("release") {
                      if (ksPath != null && file(ksPath).exists()) {
                          storeFile = file(ksPath)
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              val bom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(bom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.8.3")
              implementation("androidx.browser:browser:1.8.0")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          FEYNOS_EOF
          mkdir -p 'app'
          cat > 'app/proguard-rules.pro' <<'FEYNOS_EOF'
          -dontwarn org.bouncycastle.**
          -dontwarn org.conscrypt.**
          -dontwarn org.openjsse.**
          FEYNOS_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
