              Box(Modifier.fillMaxWidth().height(height)) {
                  HorizontalPager(pager, Modifier.fillMaxSize()) { page ->
                      val item = items[page]
                      Box(Modifier.fillMaxSize().clickable { onOpen(item) }) {
