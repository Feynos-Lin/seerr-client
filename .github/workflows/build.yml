          private val filters = listOf(
              "all" to "All", "pending" to "Pending", "approved" to "Approved",
              "processing" to "Processing", "available" to "Available", "declined" to "Declined",
          )

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun RequestsScreen(onOpen: (String, Int) -> Unit) {
              val api = LocalApi.current
              val snackbar = LocalSnackbar.current
              val scope = rememberCoroutineScope()

              var filter by rememberSaveable { mutableStateOf("all") }
              var me by remember { mutableStateOf<User?>(null) }
              val items = remember { mutableStateListOf<RequestItem>() }
              val details = remember { mutableStateMapOf<String, Details>() }
              var total by remember { mutableIntStateOf(Int.MAX_VALUE) }
              var loading by remember { mutableStateOf(false) }
              var refreshing by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf<String?>(null) }
              var gen by remember { mutableIntStateOf(0) }
              var confirmDelete by remember { mutableStateOf<RequestItem?>(null) }
              val busy = remember { mutableStateMapOf<Int, Boolean>() }
              val listState = rememberLazyListState()

              fun loadDetails(list: List<RequestItem>) {
                  list.forEach { r ->
                      val key = "${r.type}/${r.tmdbId}"
                      if (details[key] == null) scope.launch {
                          runCatching { api.details(r.type, r.tmdbId) }.getOrNull()?.let { details[key] = it }
                      }
                  }
              }

              suspend fun loadMore(reset: Boolean = false) {
                  if (loading && !reset) return
                  if (reset) { items.clear(); total = Int.MAX_VALUE }
                  if (items.size >= total) return
                  val myGen = gen
                  loading = true
                  error = null
                  try {
                      if (me == null) me = api.me()
                      val page = api.requests(filter, items.size)
                      if (myGen != gen) return
                      items.addAll(page.items.filter { n -> items.none { it.id == n.id } })
                      total = if (page.items.isEmpty()) items.size else page.total
                      loadDetails(page.items)
                  } catch (e: Exception) {
                      if (myGen == gen) error = e.message ?: "Couldn't load requests"
                  } finally {
                      if (myGen == gen) loading = false
                  }
              }

              LaunchedEffect(filter) { gen++; loading = false; loadMore(reset = true) }

              val nearEnd by remember {
                  derivedStateOf {
                      val last = listState.layoutInfo.visibleItemsInfo.lastOrNull()?.index ?: 0
                      last >= listState.layoutInfo.totalItemsCount - 4
                  }
              }
              LaunchedEffect(Unit) {
                  snapshotFlow { nearEnd }.distinctUntilChanged().filter { it }.collect { if (items.isNotEmpty()) loadMore() }
              }

              fun act(r: RequestItem, label: String, block: suspend () -> Unit) {
                  busy[r.id] = true
                  scope.launch {
                      try {
                          block()
                          snackbar.showSnackbar(label)
                          gen++
                          loading = false
                          loadMore(reset = true)
                      } catch (e: Exception) {
                          snackbar.showSnackbar(e.message ?: "Action failed")
                      } finally {
                          busy.remove(r.id)
                      }
                  }
              }

              Column(Modifier.fillMaxSize().statusBarsPadding()) {
                  Text(
                      "Requests",
                      style = MaterialTheme.typography.headlineMedium,
                      modifier = Modifier.padding(start = 20.dp, top = 16.dp, bottom = 8.dp),
                  )
                  LazyRow(
                      contentPadding = PaddingValues(horizontal = 16.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                  ) {
                      items(filters) { (key, label) ->
                          FilterChip(
                              selected = filter == key,
                              onClick = { filter = key },
                              label = { Text(label) },
                              shape = RoundedCornerShape(50),
                              colors = FilterChipDefaults.filterChipColors(
                                  selectedContainerColor = Indigo,
                                  selectedLabelColor = Color.White,
                                  containerColor = Surface2,
                                  labelColor = TextMuted,
                              ),
                              border = null,
                          )
                      }
                  }
                  Spacer(Modifier.height(8.dp))

                  PullToRefreshBox(
                      isRefreshing = refreshing,
                      onRefresh = {
                          scope.launch {
                              refreshing = true
                              gen++; loading = false
                              loadMore(reset = true)
                              refreshing = false
                          }
                      },
                      modifier = Modifier.fillMaxSize(),
                  ) {
                      LazyColumn(
                          state = listState,
                          contentPadding = PaddingValues(horizontal = 16.dp, vertical = 8.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                          modifier = Modifier.fillMaxSize(),
                      ) {
                          items(items, key = { it.id }) { r ->
                              val d = details["${r.type}/${r.tmdbId}"]
                              val user = me
                              RequestCard(
                                  r, d,
                                  canManage = user?.canManage == true,
                                  isMine = user?.id == r.requestedById,
                                  busy = busy[r.id] == true,
                                  avatarUrl = api.absoluteUrl(r.requestedByAvatar),
                                  onOpen = { onOpen(r.type, r.tmdbId) },
                                  onApprove = { act(r, "Approved") { api.approve(r.id) } },
                                  onDecline = { act(r, "Declined") { api.decline(r.id) } },
                                  onDelete = { confirmDelete = r },
                              )
                          }
                          if (items.isEmpty() && loading) {
                              items(5) { ShimmerBox(Modifier.fillMaxWidth().height(132.dp).clip(RoundedCornerShape(16.dp))) }
                          }
                          if (items.isEmpty() && !loading && error == null) {
                              item {
                                  MessageState(
                                      Icons.Filled.Inbox, "No requests",
                                      if (filter == "all") "Find something on Discover and tap Request." else "Nothing in this filter.",
                                  )
                              }
                          }
                          if (error != null) {
                              item {
                                  MessageState(Icons.Filled.CloudOff, "Couldn't load requests", error, "Retry", {
                                      scope.launch { gen++; loading = false; loadMore(reset = items.isEmpty()) }
                                  })
                              }
                          }
                          if (items.isNotEmpty() && loading) {
                              item {
                                  Box(Modifier.fillMaxWidth().padding(12.dp), contentAlignment = Alignment.Center) {
                                      CircularProgressIndicator(color = Indigo)
                                  }
                              }
                          }
                      }
                  }
              }

              confirmDelete?.let { r ->
                  val title = details["${r.type}/${r.tmdbId}"]?.title ?: "this request"
                  AlertDialog(
                      onDismissRequest = { confirmDelete = null },
                      containerColor = Surface1,
                      title = { Text("Delete request?") },
                      text = { Text("Remove the request for $title.") },
                      confirmButton = {
                          TextButton(onClick = {
                              confirmDelete = null
                              act(r, "Request deleted") { api.deleteRequest(r.id) }
                          }) { Text("Delete", color = Red) }
                      },
                      dismissButton = { TextButton(onClick = { confirmDelete = null }) { Text("Cancel") } },
                  )
              }
          }

          @Composable
          private fun RequestCard(
              r: RequestItem,
              d: Details?,
              canManage: Boolean,
              isMine: Boolean,
              busy: Boolean,
              avatarUrl: String?,
              onOpen: () -> Unit,
              onApprove: () -> Unit,
              onDecline: () -> Unit,
              onDelete: () -> Unit,
          ) {
              Box(
                  Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(16.dp))
                      .background(Surface1)
                      .clickable(onClick = onOpen)
              ) {
                  if (d?.backdropPath != null) {
                      AsyncImage(
                          tmdbImage(d.backdropPath, "w780"), null,
                          Modifier.matchParentSize().alpha(0.22f),
                          contentScale = ContentScale.Crop,
                      )
                      Box(
                          Modifier.matchParentSize().background(
                              Brush.horizontalGradient(listOf(Surface1, Surface1.copy(alpha = 0.6f)))
                          )
                      )
                  }
                  Row(Modifier.padding(12.dp)) {
                      Box(Modifier.width(72.dp).height(108.dp).clip(RoundedCornerShape(10.dp)).background(Surface2)) {
                          if (d != null) AsyncImage(tmdbImage(d.posterPath, "w185"), d.title, Modifier.matchParentSize(), contentScale = ContentScale.Crop)
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              TypePill(r.type)
                              if (r.is4k) {
                                  Spacer(Modifier.width(6.dp))
                                  Text("4K", style = MaterialTheme.typography.labelSmall, color = Color.White,
                                      modifier = Modifier.clip(RoundedCornerShape(6.dp)).background(Color(0xFF0EA5E9)).padding(horizontal = 6.dp, vertical = 2.dp))
                              }
                              if (d?.year?.isNotBlank() == true) {
                                  Spacer(Modifier.width(8.dp))
                                  Text(d.year, color = TextMuted, style = MaterialTheme.typography.labelMedium)
                              }
                              Spacer(Modifier.weight(1f))
                              if (isMine || canManage) {
                                  IconButton(onClick = onDelete, modifier = Modifier.size(28.dp)) {
                                      Icon(Icons.Filled.Delete, "Delete", tint = TextMuted, modifier = Modifier.size(18.dp))
                                  }
                              }
                          }
                          Spacer(Modifier.height(4.dp))
                          if (d != null) {
                              Text(d.title, style = MaterialTheme.typography.titleMedium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          } else {
                              ShimmerBox(Modifier.width(140.dp).height(18.dp).clip(RoundedCornerShape(4.dp)))
                          }
                          if (r.type == "tv" && r.seasons.isNotEmpty()) {
                              Text(
                                  "Season" + (if (r.seasons.size > 1) "s " else " ") + r.seasons.sorted().joinToString(", "),
                                  color = TextMuted, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis,
                              )
                          }
                          Spacer(Modifier.height(6.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Avatar(avatarUrl, r.requestedBy, 20.dp)
                              Spacer(Modifier.width(6.dp))
                              Text(
                                  "${r.requestedBy} • ${relativeTime(r.createdAt)}",
                                  color = TextMuted, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis,
                              )
                          }
                          Spacer(Modifier.height(8.dp))
                          Badge(requestStatusStyle(r.status, r.mediaStatus))
                          if (canManage && r.status == RequestStatus.PENDING) {
                              Spacer(Modifier.height(10.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Button(
                                      onClick = onApprove,
                                      enabled = !busy,
                                      colors = ButtonDefaults.buttonColors(containerColor = Green),
                                      shape = RoundedCornerShape(10.dp),
                                      contentPadding = PaddingValues(horizontal = 14.dp),
                                      modifier = Modifier.height(36.dp),
                                  ) {
                                      Icon(Icons.Filled.Check, null, Modifier.size(16.dp))
                                      Spacer(Modifier.width(4.dp))
                                      Text("Approve")
                                  }
                                  OutlinedButton(
                                      onClick = onDecline,
                                      enabled = !busy,
                                      shape = RoundedCornerShape(10.dp),
                                      contentPadding = PaddingValues(horizontal = 14.dp),
                                      colors = ButtonDefaults.outlinedButtonColors(contentColor = Red),
                                      modifier = Modifier.height(36.dp),
                                  ) {
                                      Icon(Icons.Filled.Close, null, Modifier.size(16.dp))
                                      Spacer(Modifier.width(4.dp))
                                      Text("Decline")
                                  }
                              }
                          }
                      }
                  }
              }
          }
